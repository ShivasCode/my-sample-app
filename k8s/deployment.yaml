apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          # CI replaces c45987c with the real git commit hash on every push
          # e.g. docker.legiontechinc.com/myproject/sample-app:a1b2c3d
          image: teo-harbor.legiontech.dev/myproject/myapp:56
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 100m
      # This secret lets EKS pull images from your private Harbor registry
      # Create it once: kubectl create secret docker-registry harbor-secret \
      #   --docker-server=docker.legiontechinc.com \
      #   --docker-username=YOUR_USER \
      #   --docker-password=YOUR_PASSWORD
      imagePullSecrets:
        - name: harbor-secret
